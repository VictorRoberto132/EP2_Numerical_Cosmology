# Working copy of the fiducial CLASS configuration for Exercise 5.
#
# The lecture's file 09-Primordial-Boltzmann/Figs/Scripts/class_base.ini is not
# in this repository, so it is rebuilt here from the fiducial model of the
# Lecture 9 notes, eqs. (8.1)-(8.2), run with CLASS v3.4.0
# (commit 64bbab707faf4de4779a9e04edd180fef18d98fa), nonlinear corrections off.
# Everything not listed here is a CLASS v3.4.0 default (see explanatory.ini).
# The output root is added by Library/exercise_5.py (separate output directory).

# --- requested output: linear matter power spectrum and density transfers ---
output = mPk,mTk
z_pk = 0
P_k_max_h/Mpc = 10.
non_linear = none
gauge = synchronous

# --- physical parameters, notes eqs. (8.1)-(8.2) ---
h = 0.674
omega_b = 0.0224
omega_cdm = 0.120
A_s = 2.10e-9
n_s = 0.965
k_pivot = 0.05
tau_reio = 0.054

# --- neutrinos: one massive species, sum m_nu = 0.06 eV ---
# T_ncdm left at its default 0.71611 (M_nu/omega_nu = 93.14 eV); N_ur chosen
# so that N_eff = 3.044, as recommended in CLASS explanatory.ini, section 3b.
N_ncdm = 1
m_ncdm = 0.06
N_ur = 2.0308

# --- file output ---
headers = yes
format = class
write_parameters = yes

# --- print derived quantities (Y_He, sigma8, ...) into the run log ---
background_verbose = 1
thermodynamics_verbose = 1
fourier_verbose = 1
